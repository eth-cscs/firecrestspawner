{{- if .Values.metricbeat.deny_metrics_endpoint }}
{{- range $issuer, $config := .Values.config.certificates }}
  {{- range $config.urls }}

apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $.Release.Name }}-jupyterhub-{{ $issuer | lower }}
spec:
  entryPoints:
    - websecure

  routes:
    # ----------------------------
    # Main JupyterHub route
    # ----------------------------
    - match: Host(`{{ . }}`)
      kind: Rule
      services:
        - name: {{ $.Release.Name }}-proxy-svc
          port: 8000

    # ----------------------------
    # Block /hub/metrics explicitly
    # ----------------------------
    - match: Host(`{{ . }}`) && PathPrefix(`/hub/metrics`)
      kind: Rule
      services:
        - name: noop@internal
          kind: TraefikService

  # ----------------------------
  # TLS FIX (this is what was missing)
  # ----------------------------
  tls:
    secretName: {{ $.Release.Name }}-cert-{{ $issuer }}-secret

---
  {{- end }}
{{- end }}
{{- end }}
